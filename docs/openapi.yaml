  /exploration-projects/{projectId}/figma-export:
    post:
      tags: [Figma Export]
      summary: Figma Export 시작
      description: |
        탐색 프로젝트의 화면을 Figma 파일로 내보냅니다.

        **전제 조건**:
        - 프로젝트에 탐색 완료된 노드가 1개 이상 존재 (status: completed)

        **Export 프로세스**:
        1. 백그라운드 Job으로 처리됩니다
        2. Figma 파일 생성 (파일명: "{프로젝트명} - Export {YYYY-MM-DD}")
        3. 노드별 처리 (isVirtual=false, status=completed 필터링):
           - 스크린샷 다운로드 (S3)
           - Figma 이미지 업로드
           - Figma Frame 생성 (Image Node + Story Text + Policies Text)
        4. Export 완료 시 FigmaExportHistory에 이력 저장

        **Layout 옵션**:
        - single: 단일 페이지에 모든 노드 배치
        - persona: 페르소나별로 페이지 분리
        - depth: Depth별로 페이지 분리

        **선택 노드 Export**:
        - nodeIds를 지정하면 해당 노드만 Export
        - null이면 전체 노드 Export
      operationId: startFigmaExport
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FigmaExportRequestDto'
      responses:
        '202':
          description: Export Job 생성 성공 (비동기 처리 시작)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFigmaExportResponseDto'
        '400':
          description: Figma 토큰 미등록 또는 유효하지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noToken:
                  value:
                    statusCode: 400
                    message: "Figma token not registered"
                    error: "Bad Request"
                invalidLayoutType:
                  value:
                    statusCode: 400
                    message: "Invalid layoutType"
                    error: "Bad Request"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

