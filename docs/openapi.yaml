          description: 탐색 시 사용된 페르소나 ID
        path:
          type: string
          description: "페이지 경로 (예: /products/detail)"
        title:
          type: string
          nullable: true
          description: 페이지 제목
        pageType:
          $ref: '#/components/schemas/PageType'
        stories:
          type: array
          items:
            type: string
          description: AI가 생성한 스토리 목록
        policies:
          $ref: '#/components/schemas/NodePolicies'
        uiElements:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/UIElement'
          description: 추출된 UI 요소 목록
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: 스크린샷 URL (서명된 S3 presigned URL, 1시간 유효)
        generatedScreenUrl:
          type: string
          format: uri
          nullable: true
          description: AI 생성 화면 스크린샷 URL (presigned URL)
        screenGenStatus:
          $ref: '#/components/schemas/ScreenGenStatus'
