          type: array
          items:
            type: string
          description: AI가 생성한 스토리 목록
        policies:
          type: object
          nullable: true
          description: AI가 생성한 화면 정책 (JSON)
        uiElements:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/UIElement'
          description: 추출된 UI 요소 목록 (가상 노드는 항상 null)
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: 스크린샷 URL (가상 노드는 항상 null)
        generatedScreenUrl:
          type: string
          format: uri
          nullable: true
          description: AI 생성 화면 스크린샷 URL (presigned URL)
        screenGenStatus:
          $ref: '#/components/schemas/ScreenGenStatus'
        isVirtual:
          type: boolean
          description: |
            가상 노드 여부
            - true: 기획 브랜치로 생성된 가상 노드
            - false: 실제 탐색으로 생성된 노드
          default: false
        depth:
          type: integer
          description: 루트 URL로부터의 깊이
        status:
          $ref: '#/components/schemas/NodeStatus'
        createdAt:
          type: string
          format: date-time
          description: 노드 생성 시간
        updatedAt:
          type: string
          format: date-time
          description: 노드 마지막 수정 시간

    ExplorationEdge:
      type: object
      required: [id, source, target, edgeType]
      properties:
        id:
          type: string
          format: uuid
          description: 엣지 고유 ID (UUID)
        source:
          type: string
          format: uuid
          description: 출발 노드 ID
        target:
          type: string
          format: uuid
          description: 도착 노드 ID
        edgeType:
          $ref: '#/components/schemas/EdgeType'
        trigger:
          type: string
          nullable: true
          description: 이동을 유발한 요소 텍스트 (버튼 레이블, 링크 텍스트)
        isVirtual:
          type: boolean
          description: |
            가상 엣지 여부
            가상 노드로 연결되는 엣지는 is_virtual = true
          default: false

    TreeNode:
      type: object
      required: [id, path, pageType, status, depth]
      properties:
        id:
          type: string
          format: uuid
          description: 노드 ID
        path:
          type: string
          description: "페이지 경로 (예: /products/detail)"
        title:
          type: string
          nullable: true
          description: 페이지 제목
        pageType:
          $ref: '#/components/schemas/PageType'
        status:
          $ref: '#/components/schemas/NodeStatus'
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: 스크린샷 썸네일 URL
        generatedScreenUrl:
          type: string
          format: uri
          nullable: true
          description: AI 생성 화면 스크린샷 URL (presigned URL)
        screenGenStatus:
          $ref: '#/components/schemas/ScreenGenStatus'
        depth:
          type: integer
          description: 루트 URL로부터의 깊이
        explorationId:
          type: string
          format: uuid
          description: 탐색 ID (Exploration 엔티티 UUID)
        storiesCount:
          type: integer
          description: AI가 생성한 스토리 수
        policies:
          type: object
          nullable: true
          description: AI가 분석한 화면 정책 (JSON)
        isVirtual:
          type: boolean
          description: 가상 노드 여부
          default: false
        interactionType:
          $ref: '#/components/schemas/InteractionType'
        interactionLabel:
          type: string
          description: "인터랙션 레이블 (page = 일반 페이지, 그 외 = 인터랙션 결과 노드)"
          default: page
        parentNodeId:
          type: string
          format: uuid
          nullable: true
          description: 오버레이 노드의 부모 노드 ID (page 타입이면 null)
        errorMessage:
          type: string
          nullable: true
          description: 에러 메시지 (status가 error일 때)
        sortOrder:
          type: integer
          description: 동일 depth 내 정렬 순서
        createdAt:
          type: string
          format: date-time
          description: 노드 생성 시간

    GetExplorationTreeResponseDto:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
          description: 트리 노드 목록
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ExplorationEdge'
          description: 트리 엣지 목록

    ExportFormat:
      type: string
      enum: [markdown, json, pdf]
      description: |
        내보내기 형식
        - markdown: 마크다운 문서 (.md)
        - json: JSON 데이터 (.json)
        - pdf: PDF 보고서 (.pdf)

    ExportRequestDto:
      type: object
      required: [format]
      properties:
        format:
          $ref: '#/components/schemas/ExportFormat'
        options:
          type: object
          properties:
            includeScreenshots:
              type: boolean
              default: true
              description: 스크린샷 포함 여부 (pdf, markdown)
            includeUnverified:
              type: boolean
              default: true
              description: 검증 불가 정책 포함 여부

    ExportResponseDto:
      type: object
      required: [downloadUrl, expiresAt, fileSize]
      properties:
        downloadUrl:
          type: string
          format: uri
          description: 다운로드 URL (서명된 S3 URL, 1시간 유효)
        expiresAt:
          type: string
          format: date-time
          description: URL 만료 시간
        fileSize:
          type: integer
          description: 파일 크기 (바이트)

    # Share Links schemas
    CreateShareLinkResponseDto:
      type: object
      required: [id, shareToken, shareUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 공유 링크 고유 ID (UUID)
        shareToken:
          type: string
          description: 공유 토큰 (64자 hex 문자열)
          example: "abc123xyz..."
        shareUrl:
          type: string
          format: uri
          description: 공유 URL (클라이언트가 복사할 전체 URL)
          example: "https://app.gridi.ai/projects/{projectId}?shareToken=abc123xyz..."
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 공유 링크 만료 시간 (null이면 무기한)
        createdAt:
          type: string
          format: date-time
          description: 공유 링크 생성 시간

    GetSharedLinkResponseDto:
      type: object
      required: [id, projectId, shareToken, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 공유 링크 고유 ID (UUID)
        projectId:
          type: string
          format: uuid
          description: 공유된 프로젝트 ID
        shareToken:
          type: string
          description: 공유 토큰
        createdAt:
          type: string
          format: date-time
          description: 생성 시간
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 만료 시간 (null이면 무기한)

    # Plugin Export schemas (export-nodes, export-data)
    GetExportNodesResponseDto:
      type: object
      required: [count, nodes]
      properties:
        count:
          type: integer
          description: 총 노드 수
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ExportNodeItem'
          description: 노드 목록

    ExportNodeItem:
      type: object
      required: [nodeId, title, path, pageType, thumbnailUrl]
      properties:
        nodeId:
          type: string
          format: uuid
          description: 탐색 노드 ID
        title:
          type: string
          nullable: true
          description: 화면 제목
        path:
          type: string
          description: URL 경로
        pageType:
          type: string
          description: 화면 유형
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: 스크린샷 presigned URL

    CreateExportDataRequestDto:
      type: object
      required: [nodeIds]
      properties:
        explorationId:
          type: string
          format: uuid
          description: 특정 탐색 세션 ID (미지정 시 최신 탐색)
        nodeIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 20
          description: Export할 노드 ID 목록 (최대 20개/배치)

    CreateExportDataResponseDto:
      type: object
      required: [historyId, projectId, projectName, pages, metadata]
      properties:
        historyId:
          type: string
          format: uuid
          description: Export history ID
        projectId:
          type: string
          format: uuid
          description: 프로젝트 ID
        projectName:
          type: string
          description: 프로젝트명
        pages:
          type: array
          items:
            $ref: '#/components/schemas/FigmaPluginExportPage'
          description: 페이지별 레이어 및 메타데이터
        metadata:
          type: object
          required: [exportedAt, version, layerFormat]
          properties:
            exportedAt:
              type: string
              format: date-time
              description: Export 완료 시간
            version:
              type: string
              description: Export 데이터 포맷 버전
            layerFormat:
              type: string
              description: 레이어 포맷 식별자

    # Figma Export schemas
    FigmaExportRequestDto:
      type: object
      required: [layoutType]
      properties:
        layoutType:
          type: string
          enum: [single, persona, depth]
          description: |
            Figma 페이지 레이아웃 타입
            - single: 단일 페이지에 모든 노드 배치
            - persona: 페르소나별로 페이지 분리
            - depth: Depth별로 페이지 분리
          example: "single"
        nodeIds:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: |
            Export할 노드 ID 목록
            - null 또는 빈 배열: 전체 노드 Export
            - 배열 지정: 해당 노드만 Export

    CreateFigmaExportResponseDto:
      type: object
      required: [id, projectId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Export ID (UUID)
        projectId:
          type: string
          format: uuid
          description: 프로젝트 ID
        status:
          $ref: '#/components/schemas/FigmaExportStatus'
        figmaFileUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Figma 파일 URL
            Export가 완료되면 설정됨
          example: "https://www.figma.com/file/xxxxxxx/ProjectName-Export-2026-02-07"
        figmaFileKey:
          type: string
          nullable: true
          description: Figma 파일 고유 키
          example: "xxxxxxx"
        progress:
          $ref: '#/components/schemas/FigmaExportProgress'
        nodeCount:
          type: integer
          description: Export할 총 노드 수
        successCount:
          type: integer
          description: 성공한 노드 수
        failureCount:
          type: integer
          description: 실패한 노드 수
        createdAt:
          type: string
          format: date-time
          description: Export 시작 시각
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Export 완료 시각

    FigmaExportStatus:
      type: string
      enum: [pending, processing, success, completed_with_errors, failed]
      description: |
        Export 상태
        - pending: 대기 중
        - processing: 처리 중
        - success: 성공 (모든 노드 Export 완료)
        - completed_with_errors: 완료 (일부 노드 실패)
        - failed: 실패

    FigmaExportProgress:
      type: object
      nullable: true
      properties:
        currentNode:
          type: integer
          description: 현재 처리 중인 노드 번호 (1부터 시작)
          example: 5
        totalNodes:
          type: integer
          description: 총 노드 수
          example: 15
        currentNodeTitle:
          type: string
          description: 현재 처리 중인 노드 제목
          example: "페이지1 > 섹션2"
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          description: 진행률 (%)
          example: 33

    GetFigmaExportHistoryResponseDto:
      type: object
      required: [count, exports]
      properties:
        count:
          type: integer
          description: Export 히스토리 총 개수
        exports:
          type: array
          items:
            $ref: '#/components/schemas/CreateFigmaExportResponseDto'
          description: Export 목록 (최신순)

    GetFigmaExportDetailResponseDto:
      allOf:
        - $ref: '#/components/schemas/CreateFigmaExportResponseDto'
        - type: object
          properties:
            failedNodes:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/FailedNodeInfo'
              description: 실패한 노드 목록 (status가 completed_with_errors 또는 failed일 때)
            errorMessage:
              type: string
              nullable: true
              description: 전체 Export 실패 사유 (status가 failed일 때)

    FailedNodeInfo:
      type: object
      required: [nodeId, title, error]
      properties:
        nodeId:
          type: string
          format: uuid
          description: 실패한 노드 ID
        title:
          type: string
          description: 노드 제목
          example: "페이지1 > 섹션1"
        error:
          type: string
          description: 실패 사유
          example: "이미지 업로드 실패"

    # Figma Plugin & Design System schemas
    FigmaColor:
      type: object
      required: [r, g, b, a]
      properties:
        r:
          type: number
          description: Red (0-1)
        g:
          type: number
          description: Green (0-1)
        b:
          type: number
          description: Blue (0-1)
        a:
          type: number
          description: Alpha (0-1)

    FigmaLayerNode:
      type: object
      required: [type, x, y, width, height]
      properties:
        type:
          type: string
          enum: [RECTANGLE, TEXT, SVG, FRAME]
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        name:
          type: string
          nullable: true
        opacity:
          type: number
          nullable: true
        children:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FigmaLayerNode'

    DesignToken:
      type: object
      required: [value, count, usage]
      properties:
        value:
          type: string
          description: "토큰 값 (예: rgba(255,0,0,1))"
        count:
          type: integer
          description: 사용 횟수
        usage:
          type: array
          items:
            type: string
          description: 사용된 CSS 속성명 목록

    FontToken:
      type: object
      required: [family, size, weight, count]
      properties:
        family:
          type: string
          description: 폰트 패밀리명
        size:
          type: number
          description: 폰트 크기 (px)
        weight:
          type: string
          description: 폰트 굵기
        count:
          type: integer
          description: 사용 횟수

    SpacingToken:
      type: object
      required: [value, count, axis]
      properties:
        value:
          type: number
          description: 여백 값 (px)
        count:
          type: integer
          description: 사용 횟수
        axis:
          type: string
          enum: [horizontal, vertical, both]
          description: 적용 축

    ExtractedDesignSystem:
      type: object
      required: [colors, fonts, spacing, borderRadii, shadows, extractedAt, nodeCount]
      properties:
        colors:
          type: array
          items:
            $ref: '#/components/schemas/DesignToken'
          description: 추출된 색상 토큰 목록
        fonts:
          type: array
          items:
            $ref: '#/components/schemas/FontToken'
          description: 추출된 폰트 토큰 목록
        spacing:
          type: array
          items:
            $ref: '#/components/schemas/SpacingToken'
          description: 추출된 여백 토큰 목록
        borderRadii:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value:
                type: number
              count:
                type: integer
          description: 추출된 border-radius 토큰 목록
        shadows:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value:
                type: string
              count:
                type: integer
          description: 추출된 그림자 토큰 목록
        extractedAt:
          type: string
          format: date-time
          description: 추출 시간
        nodeCount:
          type: integer
          description: 분석에 사용된 노드 수

    DetectedComponent:
      type: object
      required: [hash, name, instances, structure, instanceCount]
      properties:
        hash:
          type: string
          description: 구조적 해시 (동일 컴포넌트 식별용)
        name:
          type: string
          description: 감지된 컴포넌트명
        instances:
          type: array
          items:
            type: object
            required: [nodeId, layerIndex, x, y]
            properties:
              nodeId:
                type: string
                format: uuid
                description: 컴포넌트가 등장하는 노드 ID
              layerIndex:
                type: integer
                description: 레이어 배열 내 인덱스
              x:
                type: number
                description: X 좌표
              y:
                type: number
                description: Y 좌표
          description: 이 컴포넌트의 모든 인스턴스 위치
        structure:
          $ref: '#/components/schemas/FigmaLayerNode'
          description: 컴포넌트 레이어 구조
        instanceCount:
          type: integer
          description: 총 인스턴스 수

    GetDetectedComponentsResponseDto:
      type: object
      required: [count, components]
      properties:
        count:
          type: integer
          description: 감지된 컴포넌트 수
        components:
          type: array
          items:
            $ref: '#/components/schemas/DetectedComponent'
          description: 감지된 컴포넌트 목록

    FigmaPluginExportPage:
      type: object
      required: [nodeId, path, pageType, layers, screenshotUrl, stories]
      properties:
        nodeId:
          type: string
          format: uuid
          description: 탐색 노드 ID
        title:
          type: string
          nullable: true
          description: 화면 제목
        path:
          type: string
          description: URL 경로
        pageType:
          type: string
          description: 화면 유형
        layers:
          type: array
          items:
            $ref: '#/components/schemas/FigmaLayerNode'
          description: Figma 레이어 구조
        screenshotUrl:
          type: string
          format: uri
          nullable: true
          description: 스크린샷 presigned URL
        stories:
          type: array
          items:
            type: string
          description: 화면 스토리 목록

    FigmaPluginExportData:
      type: object
      required: [projectId, projectName, exportId, designSystem, components, pages, metadata]
      properties:
        projectId:
          type: string
          format: uuid
          description: 프로젝트 ID
        projectName:
          type: string
          description: 프로젝트명
        exportId:
          type: string
          format: uuid
          description: Export ID
        designSystem:
          $ref: '#/components/schemas/ExtractedDesignSystem'
          description: 추출된 디자인 시스템 토큰
        components:
          type: array
          items:
            $ref: '#/components/schemas/DetectedComponent'
          description: 감지된 반복 컴포넌트 목록
        pages:
          type: array
          items:
            $ref: '#/components/schemas/FigmaPluginExportPage'
          description: 페이지별 레이어 및 메타데이터
        metadata:
          type: object
          required: [exportedAt, version, layerFormat]
          properties:
            exportedAt:
              type: string
              format: date-time
              description: Export 완료 시간
            version:
              type: string
              description: Export 데이터 포맷 버전
              example: '2.0.0'
            layerFormat:
              type: string
              description: 레이어 포맷 식별자
              example: 'figma-layer-v1'

    # Admin LLM schemas
    UpdateProjectLlmConfigRequestDto:
      type: object
      properties:
        llmProvider:
          type: string
          nullable: true
          enum: [anthropic, openai]
          description: LLM 프로바이더 (null이면 기본값 사용)
        llmModel:
          type: string
          nullable: true
          maxLength: 100
          description: LLM 모델명 (null이면 기본값 사용)

    UpdateLlmFeatureRequestDto:
      type: object
      required: [provider, model]
      properties:
        provider:
          type: string
          enum: [anthropic, openai]
        model:
          type: string

    LlmFeatureConfig:
      type: object
      required: [feature, provider, model]
      properties:
        feature:
          type: string
          description: 기능 식별자
        provider:
          type: string
          enum: [anthropic, openai]
        model:
          type: string
        updatedAt:
          type: string
          format: date-time

    # Error schemas
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string

    # Usage schemas
    FeatureBalanceItem:
      type: object
      required: [featureType, includedAmount, includedUsed, includedRemaining, purchasedTotal, purchasedRemaining, totalRemaining, unitPriceKrw, betaDiscount]
      properties:
        featureType:
          type: string
          enum: [project, exploration, figma_export_node, branch, visual_edit, design_sync]
        includedAmount:
          type: integer
        includedUsed:
          type: integer
        includedRemaining:
          type: integer
        purchasedTotal:
          type: integer
        purchasedRemaining:
          type: integer
        totalRemaining:
          type: integer
        unitPriceKrw:
          type: integer
        betaDiscount:
          type: integer

    GetUsageBalanceResponseDto:
      type: object
      required: [renewalPeriod, features]
      properties:
        renewalPeriod:
          type: string
          enum: [daily, monthly, none]
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureBalanceItem'

    InitUsagePurchaseRequestDto:
      type: object
      required: [currency, items]
      properties:
        currency:
          type: string
          enum: [KRW, USD]
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseUsageItem'
          minItems: 1

    PurchaseUsageItem:
      type: object
      required: [featureType, amount]
      properties:
        featureType:
          type: string
          enum: [project, exploration, figma_export_node, branch, visual_edit, design_sync]
        amount:
          type: integer
          minimum: 1

    InitUsagePurchaseResponseDto:
      type: object
      required: [paymentId, storeId, channelKey, channelType, currency, amount, orderName, customerEmail]
      properties:
        paymentId:
          type: string
        storeId:
          type: string
