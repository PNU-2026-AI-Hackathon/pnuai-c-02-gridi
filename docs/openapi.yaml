          nullable: true
          description: "분석에 사용된 LLM provider (예: anthropic)"
        analysisModel:
          type: string
          nullable: true
          description: "분석에 사용된 LLM 모델명 (예: sonnet)"
        screenGenProvider:
          type: string
          nullable: true
          description: "화면 생성에 사용된 LLM provider"
        screenGenModel:
          type: string
          nullable: true
          description: "화면 생성에 사용된 LLM 모델명 (예: opus)"
        branchFeatureName:
          type: string
          nullable: true
          description: "분기 생성 시 사용자가 입력한 기능명"
        branchDescription:
          type: string
          nullable: true
          description: "분기 생성 시 사용자가 입력한 PRD/기능 설명"
        parentEdges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeInfo'
          description: 이 노드로 들어오는 엣지 목록
        childEdges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeInfo'
          description: 이 노드에서 나가는 엣지 목록
        createdAt:
          type: string
          format: date-time
          description: 노드 생성 시간
        updatedAt:
          type: string
          format: date-time
          description: 노드 마지막 수정 시간

    UpdateNodeRequestDto:
      type: object
      description: 스토리, 화면 유형, 정책 중 하나 이상이 포함되어야 함
      properties:
        stories:
          type: array
          items:
            type: string
          description: 수정할 화면 스토리 목록
        pageType:
          $ref: '#/components/schemas/PageType'
        policies:
          $ref: '#/components/schemas/NodePolicies'

    CreateBranchRequestDto:
      type: object
      required: [featureName, description]
      properties:
        featureName:
          type: string
          minLength: 1
          maxLength: 200
          description: 새 화면의 기능명
          example: "사용자 프로필 편집"
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            PRD 또는 기능 설명 (요구사항, 제약사항 등)
            AI가 이 내용을 기반으로 스토리와 정책을 생성합니다.
          example: "사용자는 자신의 프로필 정보를 수정할 수 있어야 합니다. 이름, 이메일, 프로필 사진을 변경할 수 있으며, 비밀번호 변경은 별도 화면으로 분리합니다."

    ScreenEditItem:
      type: object
      required: [selector, comment]
      properties:
        selector:
          type: string
          description: 수정 대상 요소의 CSS 셀렉터
        comment:
          type: string
          maxLength: 1000
          description: 해당 요소에 대한 수정 의견

    EditScreenRequestDto:
      type: object
      required: [edits]
      properties:
        edits:
          type: array
          items:
            $ref: '#/components/schemas/ScreenEditItem'
          description: 요소별 수정 항목 목록
        globalComment:
          type: string
          maxLength: 2000
          description: 전체 디자인에 대한 CSS 수정 의견 (색상, 레이아웃 등)

    UpdateExplorationNodeResponseDto:
      type: object
      required: [id, projectId, path, title, pageType, stories, policies, isVirtual, depth, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 노드 고유 ID (UUID)
        projectId:
          type: string
          format: uuid
          description: 소속 프로젝트 ID
        personaId:
          type: string
          format: uuid
