      summary: 도메인 자동 승인 가능 여부 체크
      description: |
        프로젝트 생성 직전 호출.
        가입 이메일 도메인과 일치하거나 동일 도메인이 DOMAIN scope로 이미 승인된 경우 즉시 APPROVED 생성.
        그 외에는 manual_required 응답.
      operationId: checkDomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckDomainRequestDto'
      responses:
        '200':
          description: 판정 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckDomainResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /domain-verifications/manual:
    post:
      tags: [Domain Verification]
      summary: 수동 도메인 인증 신청
      description: 증빙서류를 사전 업로드한 뒤 S3 키를 함께 전달.
      operationId: submitManualDomainVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitManualDomainVerificationRequestDto'
      responses:
        '201':
          description: 신청 생성됨 (pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitManualDomainVerificationResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /domain-verifications/scan:
    get:
      tags: [Domain Verification]
      summary: 가입 이메일 도메인 하위 서브도메인 스캔
      description: |
        crt.sh(Certificate Transparency) + DNS resolve로 회사 도메인의 운영 중인 서브도메인 목록 조회.
        가입 이메일이 freemail이면 403. 가입 이메일 도메인과 rootDomain이 일치하지 않으면 403.
      operationId: scanDomainSubdomains
      parameters:
        - name: rootDomain
          in: query
          required: true
          schema:
            type: string
        - name: forceRefresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 스캔 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanDomainSubdomainsResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /domain-verifications/document-upload-url:
    post:
      tags: [Domain Verification]
      summary: 증빙서류 업로드용 S3 Presigned URL 발급
      operationId: createDomainVerificationDocumentUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainVerificationDocumentUploadUrlRequestDto'
      responses:
        '200':
          description: Presigned URL 발급
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDomainVerificationDocumentUploadUrlResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ─── Admin Domain Verification ──────────────────────────
  /admin/domain-verifications:
    get:
      tags: [Admin Domain Verification]
      summary: 도메인 인증 신청 목록 (관리자)
      operationId: getAdminDomainVerifications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, revoked]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdminDomainVerificationListResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/domain-verifications/{id}:
    get:
      tags: [Admin Domain Verification]
      summary: 도메인 인증 신청 상세 (관리자)
      operationId: getAdminDomainVerificationDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDomainVerificationDetailResponseDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/domain-verifications/{id}/approve:
    post:
      tags: [Admin Domain Verification]
      summary: 도메인 인증 승인 (관리자)
      operationId: approveDomainVerification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveDomainVerificationRequestDto'
      responses:
        '200':
          description: 승인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDomainVerificationDetailResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/domain-verifications/{id}/reject:
    post:
      tags: [Admin Domain Verification]
      summary: 도메인 인증 반려 (관리자)
      operationId: rejectDomainVerification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDomainVerificationRequestDto'
      responses:
        '200':
          description: 반려 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDomainVerificationDetailResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/domain-verifications/{id}/document-url:
    get:
      tags: [Admin Domain Verification]
      summary: 증빙서류 presigned GET URL 발급 (관리자)
      description: |
        어드민이 신청 증빙서류 파일을 미리보기/다운로드하기 위한 1시간 짧은 만료 URL.
        직접 S3 키 노출 대신 매 요청 시 presigned URL을 발급.
      operationId: getDomainVerificationDocumentUrl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: presigned URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainVerificationDocumentUrlResponseDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/domain-verifications/{id}/revoke:
    post:
      tags: [Admin Domain Verification]
      summary: 도메인 인증 회수 (관리자)
      operationId: revokeDomainVerification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeDomainVerificationRequestDto'
      responses:
        '200':
          description: 회수 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDomainVerificationDetailResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/domain-verifications/audit-logs:
    get:
      tags: [Admin Domain Verification]
      summary: 도메인 인증 감사 로그 통합 조회 (관리자)
      operationId: getAdminDomainVerificationAuditLogs
      parameters:
        - name: verificationId
          in: query
          required: false
          schema:
            type: string
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - request_created
              - document_uploaded
              - auto_approved
              - manual_approved
              - rejected
              - revoked
        - name: actorUserId
          in: query
          required: false
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdminDomainVerificationAuditLogListResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    shareTokenParam:
      name: shareToken
      in: query
      required: false
      description: 공유 링크 토큰 (공유받은 사용자의 읽기 접근용)
      schema:
        type: string

  schemas:
    # Auth schemas
    SignupRequestDto:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1

    SignupResponseDto:
      type: object
      required: [message, email, expiresInSeconds]
      properties:
        message:
          type: string
        email:
          type: string
          description: 마스킹된 이메일 (t***@gmail.com)
        expiresInSeconds:
          type: integer
          description: 인증 코드 유효 시간 (초)

    VerifyEmailRequestDto:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6

    VerifyEmailResponseDto:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    ResendVerificationRequestDto:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResendVerificationResponseDto:
      type: object
      required: [message, email, expiresInSeconds]
      properties:
        message:
          type: string
        email:
          type: string
        expiresInSeconds:
          type: integer

    LoginRequestDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenRequestDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LogoutRequestDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LoginResponseDto:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    InitDeviceAuthResponseDto:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: 64자 hex 디바이스 인증 코드
        expiresAt:
          type: string
          format: date-time

    CompleteDeviceAuthRequestDto:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 64
          maxLength: 64

    CompleteDeviceAuthResponseDto:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    PollDeviceAuthRequestDto:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 64
          maxLength: 64

    PollDeviceAuthResponseDto:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, completed, expired]
        accessToken:
          type: string
        refreshToken:
          type: string

    RefreshTokenResponseDto:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    User:
      type: object
      required: [id, email, name, isFreemail, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        preferredLanguage:
          type: string
          enum: [ko, en]
          nullable: true
          description: |
            사용자의 선호 언어 설정.
            - ko: 한국어
            - en: 영어
            null인 경우 브라우저 언어 설정을 따름
        isFreemail:
          type: boolean
          description: |
            가입 이메일이 자유 메일 도메인인지.
            도메인 인증 UI 분기에 사용.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateUserRequestDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: 사용자 이름
        preferredLanguage:
          type: string
          enum: [ko, en]
          nullable: true
          description: |
            선호 언어 설정
            - ko: 한국어
            - en: 영어
            null로 설정하면 브라우저 언어 설정을 따름

    # Exploration Projects schemas
    ExplorationProject:
      type: object
      required: [id, userId, name, targetUrl, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 프로젝트 고유 ID (UUID)
        userId:
          type: string
          format: uuid
          description: 프로젝트 소유자 사용자 ID
        name:
          type: string
          maxLength: 200
          description: 프로젝트명
        targetUrl:
          type: string
          format: uri
          description: 분석 대상 URL
        description:
          type: string
          nullable: true
          description: 프로젝트 설명 (자동 추출 또는 수동 입력)
        llmProvider:
          type: string
          nullable: true
          description: 프로젝트별 LLM 프로바이더 (anthropic, openai 또는 null)
        llmModel:
          type: string
          nullable: true
          description: 프로젝트별 LLM 모델명 (또는 null)
        createdAt:
          type: string
          format: date-time
          description: 프로젝트 생성 시간
        updatedAt:
          type: string
          format: date-time
          description: 프로젝트 마지막 수정 시간

    GetExplorationProjectDetailResponseDto:
      type: object
      description: 프로젝트 상세 조회 응답 (활성 세션 포함)
      required: [id, userId, name, targetUrl, createdAt, updatedAt, activeSession, authType, domainVerified]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        targetUrl:
          type: string
          format: uri
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        authType:
          type: string
          enum: [owner, editor, viewer]
          description: 현재 사용자의 접근 권한 유형
        domainVerified:
          type: boolean
          description: |
            프로젝트 대상 도메인이 현재 사용자에게 인증되었는지.
            false면 프론트엔드가 액션을 차단하고 인증 플로우를 강제.
        activeSession:
          nullable: true
          description: 현재 활성 브라우저 세션 (없으면 null)
          allOf:
            - $ref: '#/components/schemas/GetBrowserSessionStatusResponseDto'

    CreateExplorationProjectRequestDto:
      type: object
      required: [targetUrl]
      properties:
        targetUrl:
          type: string
          format: uri
          description: 분석 대상 URL (자동으로 메타데이터가 추출됨)

    UpdateExplorationProjectRequestDto:
      type: object
      description: 이름과 설명 중 하나 이상이 포함되어야 함
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          description: 프로젝트명
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: 프로젝트 설명

    CheckUrlRequestDto:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: 확인할 URL

    GetExplorationProjectListResponseDto:
      type: object
      required: [count, projects]
      properties:
        count:
          type: integer
          description: 프로젝트 수
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ExplorationProject'

    CheckUrlResponseDto:
      type: object
      required: [isDuplicate]
      properties:
        isDuplicate:
          type: boolean
          description: 중복 여부
        isRootUrl:
          type: boolean
          description: 입력한 URL이 루트 URL인지 여부 (isDuplicate=false 시 포함)
        rootUrl:
          type: string
          description: 루트 도메인 URL (isDuplicate=false 시 포함)
        metadata:
          type: object
          description: 메타데이터 (isDuplicate=false 시 포함)
          properties:
            title:
              type: string
              nullable: true
              description: 웹 페이지 제목
            description:
              type: string
              nullable: true
              description: 웹 페이지 설명 (meta description)
        existingProject:
          type: object
          description: 기존 프로젝트 정보 (isDuplicate=true 시 포함)
          properties:
            id:
              type: string
              format: uuid
              description: 기존 프로젝트 ID
            name:
              type: string
              description: 기존 프로젝트명

    # Exploration Personas schemas
    GetExplorationPersonaListResponseDto:
      type: object
      required: [count, personas]
      properties:
        count:
          type: integer
          description: 페르소나 수
        personas:
          type: array
          items:
            $ref: '#/components/schemas/ExplorationPersona'

    ExplorationPersona:
      type: object
      required: [id, projectId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 페르소나 고유 ID (UUID)
        projectId:
          type: string
          format: uuid
          description: 소속 탐색 프로젝트 ID
        name:
          type: string
          maxLength: 100
          description: 페르소나 이름
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: 페르소나 설명
        characteristics:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            페르소나 특성 (키-값 쌍)
            예시: {"subscription": "free", "access_level": "basic", "language": "ko"}
        createdAt:
          type: string
          format: date-time
          description: 페르소나 생성 시간
        updatedAt:
          type: string
          format: date-time
          description: 페르소나 마지막 수정 시간

    CreatePersonaRequestDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          description: 페르소나 이름 (필수, 최대 100자)
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: 페르소나 설명 (선택사항, 최대 1000자)
        characteristics:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            페르소나 특성 (선택사항)
            키: 영문, 숫자, 언더스코어만 사용 가능 (정규식: ^[a-zA-Z0-9_]+$)
            값: 문자열
            예시: {"subscription": "free", "access_level": "basic"}

    UpdatePersonaRequestDto:
      type: object
      description: 이름, 설명, 특성 중 하나 이상이 포함되어야 함
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          description: 페르소나 이름 (선택사항, 최대 100자)
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: 페르소나 설명 (선택사항, 최대 1000자)
        characteristics:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            페르소나 특성 (선택사항)
            키: 영문, 숫자, 언더스코어만 사용 가능 (정규식: ^[a-zA-Z0-9_]+$)
            값: 문자열
            예시: {"subscription": "premium", "access_level": "full"}

    # Browser Sessions schemas
    BrowserSessionStatus:
      type: string
      enum: [starting, active, active-background, idle, take-over-active, expired, error]
      description: |
        브라우저 세션 상태
        - starting: 세션 시작 중 (Steel 초기화)
        - active: 실행 중 (AI 탐색 진행 중)
        - active-background: 백그라운드 실행 중 (사용자가 페이지를 떠남)
        - idle: 일시정지 (사용자가 명시적으로 일시정지)
        - take-over-active: 직접 조작 중 (사용자가 서버 브라우저 제어)
        - expired: 만료됨 (24시간 타임아웃)
        - error: 오류 (Steel 연결 실패 등)

    CreateBrowserSessionResponseDto:
      type: object
      required: [sessionId, status, liveViewUrl, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
          description: 생성된 세션 ID (gridi DB)
        status:
          $ref: '#/components/schemas/BrowserSessionStatus'
        liveViewUrl:
          type: string
          format: uri
          description: |
            Steel 라이브 뷰 URL
            iframe으로 임베드하여 실시간 브라우저 화면 표시
            예시: http://localhost:3000/sessions/steel-sess-abc123/ui
        expiresAt:
          type: string
          format: date-time
          description: 세션 만료 시간 (기본 24시간 후)

    GetBrowserSessionStatusResponseDto:
      type: object
      required: [sessionId, status, liveViewUrl, isLoggedIn, expiresAt, createdAt]
      properties:
        sessionId:
          type: string
          format: uuid
          description: 세션 ID (gridi DB)
        status:
          $ref: '#/components/schemas/BrowserSessionStatus'
        liveViewUrl:
          type: string
          format: uri
          description: Steel 라이브 뷰 URL
        isLoggedIn:
          type: boolean
          description: |
            탐색 대상 서비스 로그인 여부
            Take Over 모드에서 제어권 반환 시 쿠키 검증으로 업데이트됨
        expiresAt:
          type: string
          format: date-time
          description: 세션 만료 시간
        createdAt:
          type: string
          format: date-time
          description: 세션 생성 시간

    # Exploration schemas
    GetExplorationResponseDto:
      type: object
      required: [id, projectId, status, startPath, maxDepth, language, captureScreenshots, generateStories, nodesExplored, nodesDiscovered, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 탐색 고유 ID (UUID)
        projectId:
          type: string
          format: uuid
          description: 소속 프로젝트 ID
        status:
          type: string
          enum: [exploring, paused, completed, error]
          description: 탐색 상태
        startPath:
          type: string
          description: 탐색 시작 경로
        maxDepth:
          type: integer
          description: 탐색 깊이
        language:
          type: string
          description: 분석 언어
        captureScreenshots:
          type: boolean
          description: 스크린샷 캡처 여부
        generateStories:
          type: boolean
          description: 스토리 생성 여부
        nodesExplored:
          type: integer
          description: 탐색 완료된 노드 수
        nodesDiscovered:
          type: integer
          description: 발견된 전체 노드 수
        pauseReason:
          type: string
          nullable: true
          enum: [login_required, token_insufficient, manual]
          description: 일시정지 사유 (paused 상태일 때만)
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: 탐색 시작 시간
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 탐색 완료 시간
        createdAt:
          type: string
          format: date-time
          description: 생성 시간

    GetExplorationListResponseDto:
      type: object
      required: [count, explorations]
      properties:
        count:
          type: integer
          description: 총 탐색 수
        explorations:
          type: array
          items:
            $ref: '#/components/schemas/GetExplorationResponseDto'
          description: 탐색 목록 (최신순)

    ExplorationLogEntry:
      type: object
      required: [id, explorationId, type, message, createdAt]
      properties:
        id:
          type: string
          description: 로그 고유 ID
        explorationId:
          type: string
          format: uuid
          description: 소속 탐색 ID
        type:
          type: string
          enum: [discovered, analyzed, analyzing, error, info, loginRequired]
          description: 로그 유형
        message:
          type: string
          description: 로그 메시지
        nodeId:
          type: string
          nullable: true
          description: 관련 노드 ID
        step:
          type: string
          nullable: true
          description: 분석 단계 (navigation, screenshot, story, policies)
        usedProvider:
          type: string
          nullable: true
          description: "해당 단계에서 사용된 LLM provider (예: anthropic, openai)"
        usedModel:
          type: string
          nullable: true
          description: "해당 단계에서 사용된 LLM 모델명 (예: sonnet, opus)"
        createdAt:
          type: string
          format: date-time
          description: 로그 생성 시간

    PageType:
      type: string
      enum: [landing, list, detail, form, dashboard, settings, error, auth, unknown]
      description: |
        화면 유형
        - landing: 랜딩/소개 페이지
        - list: 목록 화면
        - detail: 상세 화면
        - form: 폼/입력 화면
        - dashboard: 대시보드
        - settings: 설정 화면
        - error: 에러 화면
        - auth: 인증 화면 (로그인, 회원가입)
        - unknown: 분류 불가

    ScreenGenStatus:
      type: string
      enum: [none, generating, completed, error]
      description: |
        화면 생성 상태
        - none: 미생성
        - generating: 생성 중
        - completed: 생성 완료
        - error: 생성 실패

    NodeStatus:
      type: string
      enum: [pending, exploring, crawled, analyzing, completed, error]
      description: |
        노드 상태
        - pending: 탐색 대기
        - exploring: 크롤링 중
        - crawled: 크롤링 완료 (AI 분석 대기)
        - analyzing: AI 분석 중
        - completed: 탐색 완료
        - error: 에러 발생

    EdgeType:
      type: string
      enum: [link_click, button_click, form_submit, redirect, overlay_trigger]
      description: |
        엣지 유형 (화면 이동 방식)
        - link_click: 링크 클릭
        - button_click: 버튼 클릭
        - form_submit: 폼 제출
        - redirect: 리다이렉트
        - overlay_trigger: 오버레이/모달 트리거

    InteractionType:
      type: string
      enum: [page, modal, dialog, dropdown, tooltip, drawer, popover]
      description: |
        인터랙션 유형
        - page: 일반 페이지
        - modal: 모달
        - dialog: 다이얼로그
        - dropdown: 드롭다운
        - tooltip: 툴팁
        - drawer: 드로어
        - popover: 팝오버

    StartExplorationRequestDto:
      type: object
      properties:
        personaIds:
          type: array
          items:
            type: string
            format: uuid
          description: 탐색에 사용할 페르소나 ID 목록 (선택사항)
        maxDepth:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: 탐색 깊이 (기본 3, 최대 10)
        startPath:
          type: string
          default: '/'
          description: |
            탐색 시작 경로 (기본값 '/').
            프로젝트 targetUrl의 origin과 결합하여 시작 URL 생성.
            예: '/products' → targetUrl + /products
        language:
          type: string
          default: 'en'
          description: 분석 언어 (기본 'en')
        options:
          type: object
          properties:
            captureScreenshots:
              type: boolean
              default: true
              description: 스크린샷 캡처 여부
            generateStories:
              type: boolean
              default: true
              description: Claude API로 스토리 생성 여부

    StartExplorationResponseDto:
      type: object
      required: [explorationId, status, startedAt]
      properties:
        explorationId:
          type: string
          format: uuid
          description: 탐색 ID (루트 노드 ID)
        status:
          type: string
          enum: [exploring]
          description: 탐색 상태
        startedAt:
          type: string
          format: date-time
          description: 탐색 시작 시간

    StopExplorationRequestDto:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [pause, complete]
          description: |
            중단 모드
            - pause: 일시중지 (나중에 재개 가능)
            - complete: 완료 처리

    StopExplorationResponseDto:
      type: object
      required: [status, nodesExplored, nodesDiscovered, stoppedAt]
      properties:
        status:
          type: string
          enum: [paused, completed]
          description: 중단 후 상태
        nodesExplored:
          type: integer
          description: 탐색 완료된 노드 수
        nodesDiscovered:
          type: integer
          description: 발견된 전체 노드 수
        stoppedAt:
          type: string
          format: date-time
          description: 중단 시간

    ExplorationNode:
      type: object
      required: [id, path, pageType, status, depth, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 노드 고유 ID (UUID)
        explorationId:
          type: string
          format: uuid
          description: 소속 탐색 ID
        path:
          type: string
          description: "페이지 경로 (예: /products/detail)"
        title:
          type: string
          nullable: true
          description: 페이지 제목 (title 태그)
        pageType:
          $ref: '#/components/schemas/PageType'
        status:
          $ref: '#/components/schemas/NodeStatus'
        storiesCount:
          type: integer
          description: AI가 생성한 스토리 수
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: 스크린샷 URL (서명된 S3 presigned URL, 1시간 유효)
        depth:
          type: integer
          description: 루트 URL로부터의 깊이
        personaId:
          type: string
          format: uuid
          nullable: true
          description: 탐색 시 사용된 페르소나 ID
        policiesCount:
          type: integer
          description: 수집된 정책 수
        isVirtual:
          type: boolean
          description: 가상 노드 여부
          default: false
        createdAt:
          type: string
          format: date-time
          description: 노드 생성 시간

    GetExplorationNodeListResponseDto:
      type: object
      required: [count, nodes]
      properties:
        count:
          type: integer
          description: 전체 노드 수
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ExplorationNode'

    PolicyCategory:
      type: object
      required: [category, items]
      properties:
        category:
          type: string
          description: 정책 카테고리 이름
        items:
          type: array
          items:
            type: string
          description: 해당 카테고리의 정책 문장 목록

    NodePolicies:
      type: object
      properties:
        categories:
          type: array
