      responses:
        '200':
          description: Export 가능한 노드 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExportNodesResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{projectId}/export-data:
    post:
      tags: [Figma Export]
      summary: 선택된 노드의 Export 데이터 생성
      description: |
        선택된 노드들의 레이어 데이터, 스토리, 스크린샷을 반환합니다.
        과금은 이 시점에 선택된 노드 수만큼 발생합니다.
        Export history도 함께 기록됩니다.
      operationId: createExportData
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportDataRequestDto'
      responses:
        '201':
          description: Export 데이터 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExportDataResponseDto'
        '400':
          description: 완료된 노드 없음 또는 사용량 부족
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{projectId}/design-system:
    get:
      tags: [Figma Export]
      summary: 프로젝트 디자인 시스템 조회
      description: |
        프로젝트에서 추출된 디자인 토큰(색상, 폰트, 여백, 그림자 등)을 조회합니다.
        탐색된 화면들의 레이어 데이터에서 자동으로 추출됩니다.
      operationId: getDesignSystem
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 디자인 시스템 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedDesignSystem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{projectId}/components:
    get:
      tags: [Figma Export]
      summary: 감지된 반복 컴포넌트 목록 조회
      description: |
        프로젝트에서 감지된 반복 UI 컴포넌트 목록을 조회합니다.
        구조적 해시를 기반으로 동일한 레이어 구조가 여러 화면에서 반복되는 패턴을 감지합니다.
      operationId: getDetectedComponents
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 컴포넌트 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDetectedComponentsResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{projectId}/exploration/{explorationId}/nodes/{nodeId}/retry-analysis:
    post:
      tags: [Exploration]
      summary: 노드 재분석 (스크린샷 + Claude 재분석)
      description: |
        특정 노드의 스크린샷을 다시 캡처하고 Claude로 재분석합니다.
        스크린샷 캡처/업로드 실패 또는 분석 오류가 발생한 노드를 재시도할 때 사용합니다.

        **전제 조건**:
        - 노드가 exploring 상태가 아닐 것
        - 프로젝트가 현재 탐색 중이 아닐 것 (Puppeteer 충돌 방지)
        - 활성 브라우저 세션이 존재할 것
      operationId: retryNodeAnalysis
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: explorationId
          in: path
          required: true
          description: 탐색 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: path
          required: true
          description: 재분석할 노드 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 재분석 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExplorationNodeDetailResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{projectId}/exploration/{explorationId}/nodes/{nodeId}/branch:
    post:
      tags: [Exploration]
      summary: 기획 브랜치 생성 (가상 노드)
      description: |
        기존 노드에서 새로운 가상 분기 노드를 생성합니다.
        AI가 부모 노드의 맥락을 기반으로 새 화면의 스토리와 정책을 자동 생성합니다.

        **전제 조건**:
        - 부모 노드가 completed 상태여야 함

        **생성되는 노드**:
        - is_virtual: true
        - 부모 노드의 story/policies를 기반으로 AI 분석
        - 실제 스크린샷 없음 (thumbnailUrl: null)
        - UI 요소 추출 없음 (uiElements: null)

        **사용 사례**:
        - PM/기획자가 탐색 트리에서 새로운 화면 흐름 시뮬레이션
        - 실제 탐색 없이 아이디어 검증
      operationId: createBranch
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: explorationId
          in: path
          required: true
          description: 탐색 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: path
          required: true
          description: 부모 노드 ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequestDto'
      responses:
        '201':
          description: 가상 노드 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateExplorationNodeResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 부모 노드를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 부모 노드가 completed 상태가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 422
                message: "Cannot create branch from non-completed node"
                error: "Unprocessable Entity"
        '500':
          description: AI 분석 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 500
                message: "AI analysis failed: Claude API rate limit exceeded"
                error: "Internal Server Error"

  /exploration-projects/{projectId}/exploration/{explorationId}/nodes/{nodeId}/generate-screen:
    post:
      tags: [Exploration]
      summary: 화면 이미지 생성 (수동 트리거)
      description: |
        노드의 스토리/정책을 기반으로 AI가 화면 이미지를 생성합니다.
        이미 생성 중인 경우 무시됩니다.
      operationId: generateScreen
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: explorationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: 생성 작업 시작됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: generating
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 노드를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exploration-projects/{projectId}/exploration/{explorationId}/nodes/{nodeId}/edit-screen:
    post:
      tags: [Exploration]
      summary: 화면 부분 편집 (셀렉터 기반)
      description: |
        기존 생성된 HTML에서 특정 요소만 수정합니다.
        각 편집 항목은 CSS 셀렉터와 수정 코멘트로 구성됩니다.
        globalComment는 전체 CSS 스타일에 대한 수정 요청입니다.
      operationId: editScreen
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: explorationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditScreenRequestDto'
      responses:
        '202':
          description: 편집 작업 시작됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: editing
        '400':
          description: 편집할 HTML이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 노드를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exploration-projects/{projectId}/exploration/{explorationId}/nodes/{nodeId}/generated-html:
    get:
      tags: [Exploration]
      summary: 생성된 HTML 콘텐츠 조회
      description: |
        AI가 생성한 HTML 콘텐츠를 직접 반환합니다.
      operationId: getGeneratedHtml
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: explorationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/shareTokenParam'
      responses:
        '200':
          description: 생성된 HTML 콘텐츠
          content:
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
                    nullable: true
                    description: 생성된 HTML 콘텐츠 (null이면 생성된 HTML 없음)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 노드를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exploration-projects/{projectId}/exploration/{explorationId}/export:
    post:
      tags: [Exploration]
      summary: 탐색 결과 내보내기
      description: |
        탐색 결과를 파일로 내보냅니다.

        **지원 형식**:
        - `markdown`: 화면별 스토리, 정책 문서 (.md)
        - `json`: 전체 노드/엣지 데이터 (.json)
        - `pdf`: 스크린샷 포함 보고서 (.pdf)

        **반환값**:
        - 서명된 S3 다운로드 URL (1시간 유효)
      operationId: exportExploration
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: explorationId
          in: path
          required: true
          description: 탐색 ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequestDto'
      responses:
        '200':
          description: 내보내기 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponseDto'
        '400':
          description: 탐색된 노드가 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Payment endpoints
  /payment/plan:
    get:
      tags: [Payment]
      summary: 내 현재 플랜 및 구독 정보
      operationId: getMyPlan
      responses:
        '200':
          description: 현재 플랜 + 구독 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyPlanResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /payment/plans:
    get:
      tags: [Payment]
      summary: 활성 플랜 목록 (가격표용)
      operationId: getAvailablePlans
      responses:
        '200':
          description: 활성 플랜 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAvailablePlanListResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /payment/mode:
    get:
      tags: [Payment]
      summary: 결제 운영 모드 조회 (consultation | live)
      operationId: getPaymentMode
      responses:
        '200':
          description: 현재 결제 운영 모드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentModeResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /payment/transactions:
    get:
      tags: [Payment]
      summary: 내 결제 내역 (최신순, 페이지네이션)
      operationId: getPaymentTransactions
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 결제 내역 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentTransactionListResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /payment/billing-key/config:
    get:
      tags: [Payment]
      summary: 빌링키 발급용 설정 (storeId/채널키)
      description: 프론트가 PortOne SDK requestIssueBillingKey를 호출하기 위한 설정 반환.
      operationId: getBillingKeyConfig
      parameters:
        - in: query
          name: currency
          required: true
          schema:
            type: string
            enum: [KRW, USD]
      responses:
        '200':
          description: 빌링키 발급 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBillingKeyConfigResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /payment/billing-keys:
    get:
      tags: [Payment]
      summary: 내 등록 결제수단(빌링키) 목록
      operationId: listBillingKeys
      responses:
        '200':
          description: 빌링키 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBillingKeyListResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /payment/billing-key/{id}:
    delete:
      tags: [Payment]
      summary: 등록 결제수단(빌링키) 해지
      operationId: deleteBillingKey
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 해지 완료
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 빌링키를 찾을 수 없음

  /payment/subscription:
    post:
      tags: [Payment]
      summary: 빌링키로 구독 정기결제 시작
      description: |
        프론트가 PortOne SDK(requestIssueBillingKey)로 발급한 빌링키로
        첫 결제 + 구독 활성화 + 다음 결제 예약을 수행합니다. (live 모드 전용)
      operationId: subscribeWithBillingKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeWithBillingKeyRequestDto'
      responses:
        '201':
          description: 구독 활성화됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribeWithBillingKeyResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: 결제 실패 또는 이미 활성 구독 존재

  /payment/subscription/plan:
    patch:
      tags: [Payment]
      summary: 구독 플랜 변경
      description: |
        업그레이드: 즉시 적용 — 차액만 등록된 결제수단으로 추가결제, 만료일 유지.
        다운그레이드: 다음 결제일부터 적용 예약.
        같은 플랜 재선택: 다운그레이드 예약 취소.
      operationId: changeSubscriptionPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSubscriptionPlanRequestDto'
      responses:
        '200':
          description: 변경 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSubscriptionPlanResponseDto'
        '400':
          description: 해지 예약 상태 / 같은 플랜 / 결제수단 없음
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 활성 유료 구독 또는 플랜 없음
        '409':
          description: 차액 결제 실패

  /payment/subscription/cancel:
    post:
      tags: [Payment]
      summary: 구독 기간말 해지 예약
      description: |
        즉시 해지가 아닌 기간말 해지 — 예약결제를 취소하고 만료일까지 이용을 유지합니다.
        만료일 전까지 철회(reactivate)할 수 있습니다. 멱등.
      operationId: cancelSubscription
      responses:
        '200':
          description: 해지 예약됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 활성 유료 구독 없음

  /payment/subscription/reactivate:
    post:
      tags: [Payment]
      summary: 구독 해지 철회
      description: 기간말 해지 예약을 철회하고 다음 결제 예약을 복원합니다. (만료 전 + 활성 결제수단 보유 시)
      operationId: reactivateSubscription
      responses:
        '200':
          description: 해지 철회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactivateSubscriptionResponseDto'
        '400':
          description: 해지 예약 상태가 아니거나 활성 결제수단 없음
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 활성 유료 구독 없음

  /payment/checkout/init:
    post:
      tags: [Payment]
      summary: 체크아웃 시작 (PortOne 결제창 호출용 정보 반환)
      description: |
        선택한 플랜/주기/통화로 PaymentTransaction을 PENDING 상태로 생성하고,
        프론트엔드가 PortOne V2 SDK로 결제창을 열기 위한 정보를 반환합니다.
        통화에 따라 채널(inicis/paypal)이 자동 결정됩니다.
      operationId: initCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitCheckoutRequestDto'
      responses:
        '201':
          description: 체크아웃 정보 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitCheckoutResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 플랜을 찾을 수 없음

  /payment/checkout/verify:
    post:
      tags: [Payment]
      summary: 결제 완료 검증 + 구독 활성화
      description: |
        프론트엔드가 PortOne 결제창에서 결제 완료 후 호출.
        PortOne API로 결제 상태/금액을 검증하고 일치 시 구독을 활성화합니다.
      operationId: verifyPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequestDto'
      responses:
        '200':
          description: 결제 검증 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPaymentResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 트랜잭션을 찾을 수 없음
        '409':
          description: 금액/통화 불일치 또는 결제 미완료

  /payment/webhook:
    post:
      tags: [Payment]
      summary: PortOne Webhook 수신 (서명 검증 후 결제 상태 동기화)
      description: |
        PortOne에서 결제 상태 변경 시 호출하는 Webhook 엔드포인트.
        webhook-signature 헤더로 검증하며 JWT 인증을 요구하지 않습니다.
      operationId: portoneWebhook
      security: []
      parameters:
        - in: header
          name: webhook-id
          required: true
          schema:
            type: string
        - in: header
          name: webhook-timestamp
          required: true
          schema:
            type: string
        - in: header
          name: webhook-signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          description: 서명 검증 실패

