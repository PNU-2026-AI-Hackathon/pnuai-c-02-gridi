    EdgeInfo:
      type: object
      required: [id, edgeType]
      properties:
        id:
          type: string
          format: uuid
          description: 엣지 ID
        sourceNodeId:
          type: string
          format: uuid
          nullable: true
          description: 출발 노드 ID (parentEdges에서 사용)
