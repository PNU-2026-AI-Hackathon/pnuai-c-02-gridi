openapi: 3.0.3
info:
  title: gridi API
  description: |
    gridi - AI 서비스 빌더 플랫폼 API

    ## 인증
    대부분의 API는 JWT Bearer 토큰 인증이 필요합니다.
    `Authorization: Bearer {accessToken}` 헤더를 포함해야 합니다.
  version: 1.0.0
  contact:
    name: gridi API Support
    email: api@gridi.app

servers:
  - url: http://localhost:4000/api
    description: Development Server
  - url: https://api.gridi.app/api
    description: Production Server

tags:
  - name: Auth
    description: 인증 API
  - name: Users
    description: 사용자 API
  - name: Exploration Projects
    description: 탐색 프로젝트 API
  - name: Exploration Personas
    description: 탐색 페르소나 API
  - name: Browser Sessions
    description: 브라우저 세션 API (Steel.dev 기반 서버 브라우저)
  - name: Exploration
    description: 서비스 탐색 API (AI 기반 자동 화면 탐색)
  - name: Share Links
    description: 공유 링크 API (프로젝트 공유)
  - name: Figma Export
    description: Figma 연동 및 Export API
  - name: Payment
    description: 토큰 결제, 잔액 관리, 구독/플랜 API
  - name: Usage
    description: 기능별 사용량 관리, 추가 구매, 가격표 API
  - name: Admin
    description: 관리자 API (설정, 사용자, 통계)
  - name: Waitlist
    description: 정식 오픈 대기목록 API
  - name: Design Sync
    description: Design Sync API (Figma에서 코드 수정 + PR 생성)
  - name: Domain Verification
    description: 사용자 도메인 인증 (프로젝트 생성 권한 통제)
  - name: Admin Domain Verification
    description: 관리자 도메인 인증 승인/감사 로그 API

security:
  - bearerAuth: []

paths:
  # Auth endpoints
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입 (인증 코드 발송)
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequestDto'
      responses:
        '201':
          description: 회원가입 성공, 인증 코드 발송됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 이미 존재하는 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: 이메일 인증 코드 검증
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestDto'
      responses:
        '200':
          description: 인증 성공, 로그인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponseDto'
        '400':
          description: 잘못된 인증 코드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: 인증 코드 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: 인증 코드 재발송
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequestDto'
      responses:
        '200':
          description: 인증 코드 재발송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponseDto'
        '400':
          description: 인증 대기 중인 이메일이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 재발송 쿨다운 (60초)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 토큰 갱신
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestDto'
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponseDto'
        '401':
          description: 유효하지 않은 refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestDto'
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"

  /auth/device/init:
    post:
      tags: [Auth]
      summary: Figma 플러그인 Device Auth 초기화
      operationId: initDeviceAuth
      responses:
        '201':
          description: Device auth code 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitDeviceAuthResponseDto'

  /auth/device/callback:
    post:
      tags: [Auth]
      summary: Device Auth 완료 (웹앱에서 로그인 후 호출)
      operationId: completeDeviceAuth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteDeviceAuthRequestDto'
      responses:
        '200':
          description: Device auth 완료 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteDeviceAuthResponseDto'
        '404':
          description: 코드 만료 또는 없음

  /auth/device/poll:
    post:
      tags: [Auth]
      summary: Device Auth 상태 폴링 (Figma 플러그인에서 호출)
      operationId: pollDeviceAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollDeviceAuthRequestDto'
      responses:
        '200':
          description: 인증 상태 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollDeviceAuthResponseDto'
        '429':
          description: Rate limit 초과

  # Users endpoints
  /users/me:
    get:
      tags: [Users]
      summary: 현재 사용자 정보 조회
      operationId: getCurrentUser
      responses:
        '200':
          description: 사용자 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    patch:
      tags: [Users]
      summary: 현재 사용자 정보 수정
      description: |
        현재 로그인한 사용자의 정보를 수정합니다.
        preferredLanguage를 설정하면 UI 및 산출물 생성 시 해당 언어가 적용됩니다.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequestDto'
      responses:
        '200':
          description: 사용자 정보 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # User Auth Providers endpoints
  /users/me/auth-providers:
    get:
      tags: [Users]
      summary: OAuth 인증 프로바이더 목록 조회
      description: 현재 사용자의 OAuth 인증 프로바이더 목록을 조회합니다.
      operationId: getAuthProviders
      responses:
        '200':
          description: 인증 프로바이더 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuthProvidersResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/me/auth-providers/{provider}/connect:
    get:
      tags: [Users]
      summary: OAuth 연결 URL 조회
      description: 지정된 프로바이더의 OAuth 인증 URL을 반환합니다.
      operationId: getAuthProviderConnectUrl
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github, figma, notion]
      responses:
        '200':
          description: OAuth 연결 URL 반환 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuthProviderConnectUrlResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/me/auth-providers/{provider}/connect-repo:
    get:
      tags: [Users]
      summary: GitHub 레포 접근 OAuth 연결 URL 조회
      description: "Design Sync용 GitHub 레포 접근 OAuth 인증 URL을 반환합니다 (scope: repo,read:user)."
      operationId: getAuthProviderConnectRepoUrl
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github]
      responses:
        '200':
          description: OAuth 연결 URL 반환 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuthProviderConnectUrlResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/me/auth-providers/{provider}:
    delete:
      tags: [Users]
      summary: OAuth 연결 해제
      description: 지정된 프로바이더의 OAuth 연결을 해제합니다.
      operationId: disconnectAuthProvider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github, figma, notion]
      responses:
        '204':
          description: 연결 해제 성공
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # Exploration Projects endpoints
  /exploration-projects:
    post:
      tags: [Exploration Projects]
      summary: 새 탐색 프로젝트 생성
      description: |
        URL만 입력하여 새 탐색 프로젝트를 생성합니다.
        메타데이터(제목, 설명)는 대상 URL에서 자동으로 추출됩니다.
      operationId: createExplorationProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExplorationProjectRequestDto'
      responses:
        '201':
          description: 탐색 프로젝트 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorationProject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: 중복된 URL (이미 존재하는 프로젝트)
          content:
            application/json:
              schema:
                type: object
                required: [statusCode, message, error, existingProject]
                properties:
                  statusCode:
                    type: integer
                    example: 409
                  message:
                    type: string
                    example: "Project with this URL already exists"
                  error:
                    type: string
                    example: "Conflict"
                  existingProject:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string

    get:
      tags: [Exploration Projects]
      summary: 내 탐색 프로젝트 목록 조회
      description: |
        현재 사용자의 탐색 프로젝트 목록을 조회합니다.
        검색을 지원합니다.
      operationId: getExplorationProjects
      parameters:
        - name: search
          in: query
          description: 프로젝트명 또는 타겟 도메인으로 검색 (선택사항)
          schema:
            type: string
      responses:
        '200':
          description: 프로젝트 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExplorationProjectListResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /exploration-projects/{id}:
    get:
      tags: [Exploration Projects]
      summary: 탐색 프로젝트 상세 조회
      operationId: getExplorationProject
      parameters:
        - name: id
          in: path
          required: true
          description: 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/shareTokenParam'
      responses:
        '200':
          description: 프로젝트 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExplorationProjectDetailResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags: [Exploration Projects]
      summary: 탐색 프로젝트 수정
      description: |
        탐색 프로젝트의 이름과 설명을 수정합니다.
        타겟 URL과 상태는 수정할 수 없습니다.
      operationId: updateExplorationProject
      parameters:
        - name: id
          in: path
          required: true
          description: 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExplorationProjectRequestDto'
      responses:
        '200':
          description: 프로젝트 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorationProject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Exploration Projects]
      summary: 탐색 프로젝트 삭제
      description: |
        탐색 프로젝트 및 관련 데이터를 삭제합니다.
        탐색 중인 프로젝트는 삭제할 수 없습니다.
      operationId: deleteExplorationProject
      parameters:
        - name: id
          in: path
          required: true
          description: 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 프로젝트 삭제 성공 (응답 본문 없음)
        '400':
          description: |
            요청 오류 (예: 탐색 중인 프로젝트 삭제 시도)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{id}/share:
    post:
      tags: [Share Links]
      summary: 공유 링크 생성
      description: |
        탐색 프로젝트의 공유 링크를 생성합니다.
        이미 공유 링크가 존재하면 기존 링크를 반환합니다.
      operationId: createShareLink
      parameters:
        - name: id
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: 공유 링크 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShareLinkResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 프로젝트 소유자가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/check-url:
    post:
      tags: [Exploration Projects]
      summary: URL 중복 확인 및 메타데이터 미리보기
      description: |
        입력한 URL이 이미 프로젝트로 등록되었는지 확인하고,
        메타데이터를 미리보기합니다. (프론트엔드 실시간 검증용)
      operationId: checkExplorationProjectUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUrlRequestDto'
      responses:
        '200':
          description: URL 확인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckUrlResponseDto'
        '400':
          description: 유효하지 않은 URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # Exploration Personas endpoints
  /exploration-projects/{projectId}/personas:
    post:
      tags: [Exploration Personas]
      summary: 탐색 페르소나 생성
      description: |
        특정 탐색 프로젝트에 새 페르소나를 추가합니다.
        페르소나는 프로젝트 내에서 고유한 이름을 가져야 합니다.
      operationId: createExplorationPersona
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonaRequestDto'
      responses:
        '201':
          description: 페르소나 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorationPersona'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 중복된 페르소나 이름 (같은 프로젝트 내)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Exploration Personas]
      summary: 탐색 페르소나 목록 조회
      description: |
        특정 탐색 프로젝트의 모든 페르소나를 조회합니다.
      operationId: getExplorationPersonas
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/shareTokenParam'
      responses:
        '200':
          description: 페르소나 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExplorationPersonaListResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exploration-projects/{projectId}/personas/{personaId}:
    get:
      tags: [Exploration Personas]
      summary: 탐색 페르소나 상세 조회
      description: |
        특정 탐색 페르소나의 상세 정보를 조회합니다.
      operationId: getExplorationPersona
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: personaId
          in: path
          required: true
          description: 탐색 페르소나 ID (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/shareTokenParam'
      responses:
        '200':
          description: 페르소나 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorationPersona'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 페르소나 또는 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Exploration Personas]
      summary: 탐색 페르소나 수정
      description: |
        탐색 페르소나의 이름, 설명, 특성을 수정합니다.
      operationId: updateExplorationPersona
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: personaId
          in: path
          required: true
          description: 탐색 페르소나 ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonaRequestDto'
      responses:
        '200':
          description: 페르소나 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorationPersona'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 페르소나 또는 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 중복된 페르소나 이름 (같은 프로젝트 내)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Exploration Personas]
      summary: 탐색 페르소나 삭제
      description: |
        탐색 페르소나 및 관련 탐색 데이터를 삭제합니다.
      operationId: deleteExplorationPersona
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: personaId
          in: path
          required: true
          description: 탐색 페르소나 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 페르소나 삭제 성공 (응답 본문 없음)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 페르소나 또는 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Browser Sessions endpoints
  /exploration-projects/{projectId}/sessions:
    post:
      tags: [Browser Sessions]
      summary: 브라우저 세션 생성
      description: |
        Steel.dev 서버 브라우저 세션을 생성합니다.
        로그인이 필요한 웹 서비스를 AI가 탐색하기 위해 사용됩니다.

        **주요 기능**:
        - 서버에서 Chrome 브라우저 실행 (Steel.dev Docker)
        - 실시간 라이브 뷰 URL 제공
        - CDP WebSocket URL 제공 (Puppeteer/Playwright 연결용)
        - 기본 24시간 세션 타임아웃

        **제약사항**:
        - 프로젝트당 하나의 활성 세션만 허용
        - 기존 활성 세션이 있는 경우 400 에러 반환
      operationId: createBrowserSession
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: 브라우저 세션 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBrowserSessionResponseDto'
        '400':
          description: |
            잘못된 요청 (예: 이미 활성 세션 존재)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                activeSessionExists:
                  summary: 이미 활성 세션이 존재하는 경우
                  value:
                    statusCode: 400
                    message: "Active session already exists for this project"
                    error: "Bad Request"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Steel 서비스 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                steelServiceDown:
                  summary: Steel 서비스가 실행되지 않은 경우
                  value:
                    statusCode: 500
                    message: "Failed to create Steel session"
                    error: "Internal Server Error"

  /exploration-projects/{projectId}/sessions/active:
    get:
      tags: [Browser Sessions]
      summary: 활성 브라우저 세션 조회
      description: |
        현재 프로젝트의 활성 브라우저 세션 정보를 조회합니다.

        **활성 세션 상태**:
        - starting: 세션 시작 중
        - active: 실행 중
        - active-background: 백그라운드 실행 중
        - idle: 일시정지
        - take-over-active: 직접 조작 중
      operationId: getActiveBrowserSession
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 활성 세션 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBrowserSessionStatusResponseDto'
        '400':
          description: 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sessionExpired:
                  summary: 세션이 만료된 경우
                  value:
                    statusCode: 400
                    message: "Session has expired"
                    error: "Bad Request"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 활성 세션이 없거나 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noActiveSession:
                  summary: 활성 세션이 없는 경우
                  value:
                    statusCode: 404
                    message: "No active session found for this project"
                    error: "Not Found"

  /exploration-projects/{projectId}/sessions/active/take-over:
    post:
      tags: [Browser Sessions]
      summary: Take Over 모드 시작
      description: |
        사용자가 서버 브라우저를 직접 조작할 수 있도록 Take Over 모드를 활성화합니다.

        **사용 시나리오**:
        - AI가 로그인 화면을 감지한 경우
        - CAPTCHA 또는 2FA 인증이 필요한 경우
        - 특정 액션을 수동으로 수행해야 하는 경우

        **동작**:
        - 세션 상태가 `take-over-active`로 전환됨
        - 프론트엔드 라이브 뷰가 인터랙티브 모드로 전환됨
        - 사용자가 마우스와 키보드로 서버 브라우저 조작 가능
      operationId: enableTakeOver
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Take Over 모드 활성화 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBrowserSessionStatusResponseDto'
        '400':
          description: 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 활성 세션이 없거나 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exploration-projects/{projectId}/sessions/active/release:
    post:
      tags: [Browser Sessions]
      summary: 제어권 반환 (Take Over 종료)
      description: |
        Take Over 모드를 종료하고 AI에게 제어권을 반환합니다.

        **동작**:
        - 세션 상태가 `active`로 전환됨
        - 쿠키 검증을 통해 로그인 여부 확인 (is_logged_in 업데이트)
        - AI 탐색 재개

        **쿠키 검증 로직**:
        - CDP를 통해 브라우저 쿠키 확인
        - session, auth 등의 이름을 가진 쿠키 존재 여부로 로그인 판단
        - 쿠키 값은 저장하지 않고, 존재 여부만 확인
      operationId: releaseTakeOver
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 제어권 반환 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBrowserSessionStatusResponseDto'
        '400':
          description: 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 활성 세션이 없거나 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exploration-projects/{projectId}/sessions/active/pause:
    post:
      tags: [Browser Sessions]
      summary: 브라우저 세션 일시정지
      description: |
        활성 브라우저 세션을 일시정지합니다.

        **동작**:
        - 세션 상태가 `idle`로 전환됨
        - AI 탐색이 중단됨
        - 브라우저 인스턴스는 유지됨 (쿠키 및 세션 상태 보존)
      operationId: pauseBrowserSession
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 세션 일시정지 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBrowserSessionStatusResponseDto'
        '400':
          description: 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 활성 세션이 없거나 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exploration-projects/{projectId}/sessions/active/resume:
    post:
      tags: [Browser Sessions]
      summary: 브라우저 세션 재개
      description: |
        일시정지된 브라우저 세션을 재개합니다.

        **동작**:
        - 세션 상태가 `active`로 전환됨
        - AI 탐색이 재개됨
        - 이전 세션 상태 (쿠키, 로그인 정보)가 보존되어 있음
      operationId: resumeBrowserSession
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 세션 재개 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBrowserSessionStatusResponseDto'
        '400':
          description: 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: 활성 세션이 없거나 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Exploration endpoints
  /exploration-projects/{projectId}/exploration:
    post:
      tags: [Exploration]
      summary: 탐색 시작
      description: |
        AI가 대상 서비스를 자동으로 탐색하기 시작합니다.
        Exploration 엔티티를 생성하고, startPath 기준으로 탐색을 시작합니다.

        **전제 조건**:
        - 활성 브라우저 세션이 존재해야 함
        - 탐색 중인 상태가 아니어야 함

        **탐색 과정**:
        1. 프로젝트의 targetUrl + startPath로 이동
        2. 스크린샷 캡처 및 S3 업로드
        3. Claude Vision API로 화면 분석 (스토리, 유형)
        4. 페이지 내 링크 수집 및 탐색 큐에 추가 (startPath 범위 내)
        5. 정책 테스트 (입력 필드, 버튼)
        6. 다음 노드로 반복
      operationId: startExploration
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExplorationRequestDto'
      responses:
        '202':
          description: 탐색 시작됨 (비동기 처리)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartExplorationResponseDto'
        '400':
          description: |
            잘못된 요청
            - 활성 브라우저 세션이 없음
            - 이미 탐색 중
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noActiveSession:
                  summary: 활성 세션이 없는 경우
                  value:
                    statusCode: 400
                    message: "No active browser session. Please start a session first."
                    error: "Bad Request"
                alreadyExploring:
                  summary: 이미 탐색 중인 경우
                  value:
                    statusCode: 400
                    message: "Exploration is already in progress"
                    error: "Bad Request"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{projectId}/exploration/list:
    get:
      tags: [Exploration]
      summary: 탐색 목록 조회
      description: |
        프로젝트의 모든 Exploration 목록을 최신순으로 조회합니다.
        버전별 그래프 뷰에서 탐색 이력을 선택하는 데 사용합니다.
      operationId: getExplorations
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/shareTokenParam'
      responses:
        '200':
          description: 탐색 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExplorationListResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{projectId}/exploration/latest:
    get:
      tags: [Exploration]
      summary: 최신 탐색 조회
      description: |
        프로젝트의 가장 최근 Exploration을 조회합니다.
        프론트엔드 새로고침 시 explorationId를 복원하는 데 사용합니다.
      operationId: getLatestExploration
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/shareTokenParam'
      responses:
        '200':
          description: 최신 탐색 조회 성공 (없으면 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExplorationResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{projectId}/exploration/{explorationId}/resume:
    post:
      tags: [Exploration]
      summary: 탐색 재개
      description: |
        일시중지된 탐색을 재개합니다.
      operationId: resumeExploration
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: explorationId
          in: path
          required: true
          description: 탐색 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: 탐색 재개됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartExplorationResponseDto'
        '400':
          description: 재개할 수 없는 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exploration-projects/{projectId}/exploration/{explorationId}/stop:
    post:
      tags: [Exploration]
      summary: 탐색 중단
      description: |
        진행 중인 탐색을 중단합니다.

        **중단 모드**:
        - `pause`: 일시중지 (나중에 재개 가능)
        - `complete`: 완료 처리 (현재까지 데이터 저장)
      operationId: stopExploration
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: explorationId
          in: path
          required: true
          description: 탐색 ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopExplorationRequestDto'
