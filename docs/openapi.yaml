  /exploration-projects/{projectId}/exploration/{explorationId}/progress:
    get:
      tags: [Exploration]
      summary: 탐색 진행상황 (SSE)
      description: |
        탐색 진행상황을 Server-Sent Events로 실시간 스트리밍합니다.

        **SSE 이벤트 유형**:
        - `exploration:started`: 탐색 시작
        - `node:discovered`: 새 노드 발견
        - `node:analyzing`: 노드 분석 중 (screenshot, story, policies)
        - `node:analyzed`: 노드 분석 완료
        - `exploration:progress`: 전체 진행률 업데이트
        - `exploration:loginRequired`: 로그인 필요 (Take Over 필요)
        - `exploration:completed`: 탐색 완료
        - `exploration:error`: 에러 발생

        **연결 방법**:
        ```javascript
        const eventSource = new EventSource(
          '/api/exploration-projects/{projectId}/exploration/{explorationId}/progress',
          { withCredentials: true }
        );
        eventSource.addEventListener('node:analyzed', (e) => {
          const data = JSON.parse(e.data);
          console.log('Node analyzed:', data);
        });
        ```
      operationId: getExplorationProgress
      parameters:
        - name: projectId
          in: path
          required: true
          description: 탐색 프로젝트 ID (UUID)
          schema:
            type: string
            format: uuid
        - name: explorationId
          in: path
          required: true
          description: 탐색 ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE 스트림 연결됨
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE 이벤트 스트림. 각 이벤트는 다음 형식:
                  ```
                  event: {eventType}
                  data: {JSON 데이터}
                  ```
              examples:
                nodeDiscovered:
                  summary: 노드 발견 이벤트
                  value: |
                    event: node:discovered
                    data: {"nodeId": "uuid", "url": "https://example.com/products", "parentNodeId": "uuid", "depth": 1}
                nodeAnalyzed:
                  summary: 노드 분석 완료 이벤트
                  value: |
                    event: node:analyzed
                    data: {"nodeId": "uuid", "status": "completed", "storiesCount": 3, "pageType": "list", "title": "상품 목록", "thumbnailUrl": "https://s3.../screenshot.png?X-Amz-..."}
                progress:
                  summary: 진행률 이벤트
                  value: |
                    event: exploration:progress
                    data: {"explored": 25, "discovered": 42, "progress": 0.60, "currentUrl": "https://example.com/products"}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

